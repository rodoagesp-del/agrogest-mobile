<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroGest+ Móvil</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2C3E50">
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse para procesar el CSV de forma segura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>🌱 AgroGest+</h1>
        <p class="subtitle">Control Fitosanitario en Tiempo Real</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Buscar producto, lote o P.A..." onkeyup="filtrarDatos()">
        <div class="filters">
            <select id="filtroCategoria" onchange="filtrarDatos()">
                <option value="ALL">Categoría: Todas</option>
                <option value="CAT:SUELO">Suelo</option>
                <option value="CAT:PESTICIDAS">Pesticidas</option>
                <option value="SUB:ACARICIDAS">&nbsp;&nbsp;&nbsp;↳ Acaricidas</option>
                <option value="SUB:FUNGICIDAS">&nbsp;&nbsp;&nbsp;↳ Fungicidas</option>
                <option value="SUB:HERBICIDAS">&nbsp;&nbsp;&nbsp;↳ Herbicidas</option>
                <option value="SUB:INSECTICIDAS">&nbsp;&nbsp;&nbsp;↳ Insecticidas</option>
                <option value="CAT:FOLIARES">Foliares</option>
                <option value="SUB:BIOESTIMULANTES">&nbsp;&nbsp;&nbsp;↳ Bioestimulantes</option>
                <option value="SUB:CORRECTORES">&nbsp;&nbsp;&nbsp;↳ Correctores</option>
                <option value="SUB:NUTRIENTES">&nbsp;&nbsp;&nbsp;↳ Nutrientes</option>
                <option value="SUB:REGULADORES DE CRECIMIENTO">&nbsp;&nbsp;&nbsp;↳ Reg. Crecimiento</option>
                <option value="CAT:OTROS">Otros</option>
            </select>
            <select id="filtroAlmacen" onchange="filtrarDatos()">
                <option value="TODOS">Almacén: Todos</option>
                <option value="Almacén de San Borja">San Borja</option>
                <option value="Almacén de Quilmana">Quilmaná</option>
                <option value="Almacén Fundo">Fundo</option>
            </select>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('stock')">📦 Stock (FIFO)</button>
        <button class="tab-btn" onclick="switchTab('campo')">🚜 Aplicaciones Campo</button>
    </div>

    <main id="app-content">
        <div id="loading" class="loading">Sincronizando con almacenes...</div>
        <div id="stockView" class="view-section active"></div>
        <div id="campoView" class="view-section" style="display: none;"></div>
    </main>

    <!-- Modal Flotante de Especificaciones -->
    <div id="detallesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitle">Producto</h2>
            <div id="modalBody">
                <!-- El contenido se inyectará aquí con JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
